[project]
name = "ember"
version = "0.1.0"
description = "Talk about your day; get it indexed; ask about it later."
requires-python = ">=3.12"
dependencies = ["mcp>=2.2", "numpy>=2"]

[project.scripts]
ember = "ember.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
